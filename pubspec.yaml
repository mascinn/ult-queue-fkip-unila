name: ult_fkip_apk
description: "Aplikasi Antrean Pelayanan Administrasi Unit Layanan Terpadu (ULT) FKIP Universitas Lampung."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend & Realtime Database
  supabase_flutter: ^2.8.0

  # Local Persistence (Active Ticket & Student Profile)
  shared_preferences: ^2.3.2

  # Voice & Audio Notification
  flutter_tts: ^4.2.1
  vibration: ^2.0.1

  # UI, Icons, Fonts & Date Formatting
  intl: ^0.19.0
  google_fonts: ^6.2.1

# Pin app_links ke versi 7.2.2 (latest) yang sudah kompatibel dengan AGP 8.5+
dependency_overrides:
  app_links: 7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
