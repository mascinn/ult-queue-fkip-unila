name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK (Stable Channel)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          BUILD_ARGS=""
          if [ -n "${SUPABASE_URL}" ]; then
            BUILD_ARGS="${BUILD_ARGS} --dart-define=SUPABASE_URL=${SUPABASE_URL}"
          fi
          if [ -n "${SUPABASE_ANON_KEY}" ]; then
            BUILD_ARGS="${BUILD_ARGS} --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
          fi
          flutter build apk --release ${BUILD_ARGS}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ult-fkip-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.2' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ULT Queue FKIP Release v1.0.2' }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
